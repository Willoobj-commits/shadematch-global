workflows:
  # Unsigned. Run this first after any change that could affect the iOS build:
  # it separates "the code does not compile on macOS" from "signing is not set
  # up", which look identical from Windows. Needs no Apple account at all.
  ios-compile:
    name: ShadeMatch iOS compile check
    max_build_duration: 30
    # Must match a type the account's plan allows — linux_x2 is not on this
    # plan and the build dies at startup before a single step runs.
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Validate catalog
        script: python3 tools/validate_catalog.py assets/data/catalog_v1.json
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test
      - name: Build unsigned iOS binary
        script: flutter build ios --release --no-codesign

  ios-testflight:
    name: ShadeMatch iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      vars:
        # App Store Connect's numeric id for ShadeMatch Global, used only to
        # ask TestFlight which build number it already has. If this is wrong
        # or unset the build still succeeds — it falls back to the CI counter.
        APP_STORE_APP_ID: "6807488973"
        BUNDLE_ID: "com.shadematchglobal.shadematchglobal"
      # Automatic signing, and it works here for one specific reason: the App
      # Store profile for this bundle id was created by hand in the Developer
      # portal on 2026-09-01, before the first build ran. Automatic signing
      # only ever *fetches* — it does not create — so it succeeds when a
      # matching profile already exists and fails with "No matching profiles
      # found for bundle identifier" when one does not. That failure is what
      # makes it look broken on this account; it is really a missing profile.
      #
      # Do not delete or let that profile expire (it runs to 2027-07-26)
      # without either recreating it or switching to the manual form below.
      #
      # Manual alternative, if this ever stops resolving. It needs the profile
      # fetched into Codemagic (Settings > Code signing identities) under
      # exactly the reference name given here, which is a one-time UI step:
      #
      #   ios_signing:
      #     provisioning_profiles:
      #       - shadematch_app_store
      #     certificates:
      #       - edic_distribution
      #
      # If you take that path, check the certificate first: this account holds
      # two distribution certificates, expiring 2027-07-26 and 2027-07-20. The
      # profile for this app embeds the 2027-07-26 one. Codemagic's identity
      # named edic_distribution must be that certificate, or signing fails
      # with "No matching certificate found for every requested profile".
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shadematchglobal.shadematchglobal
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      # "No matching certificate found for every requested profile" does not
      # say whether the certificate, the bundle id, or the API key's
      # permissions is at fault. This reports what the account actually has
      # before signing runs. It never fails the build — it exists to make the
      # next failure readable.
      - name: Report signing assets
        script: |
          echo "── Distribution certificates on the account ──"
          app-store-connect list-certificates --type IOS_DISTRIBUTION || \
            echo "!! could not list certificates — usually means the API key lacks App Manager access"
          echo "── Bundle id ──"
          app-store-connect list-bundle-ids \
            --bundle-id-identifier "$BUNDLE_ID" || echo "!! could not list bundle ids"
          echo "── App Store provisioning profiles ──"
          app-store-connect list-profiles \
            --bundle-id-identifier "$BUNDLE_ID" \
            --type IOS_APP_STORE || echo "!! could not list profiles"
        ignore_failure: true
      # TestFlight rejects a build number it has already seen, so bumping
      # pubspec by hand before every upload is a step that will eventually be
      # forgotten. Ask App Store Connect what it has and go one higher; the
      # value in pubspec then only matters for local builds.
      - name: Pick a build number TestFlight has not seen
        script: |
          case "$APP_STORE_APP_ID" in
            ''|REPLACE_WITH_*)
              echo "!! APP_STORE_APP_ID is not set — falling back to the CI counter."
              echo "   Set it to the numeric Apple ID from App Store Connect > App Information."
              LATEST=""
              ;;
            *)
              LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || true)
              ;;
          esac

          # Treat empty (no builds yet) or any non-numeric output as unknown,
          # rather than feeding it to arithmetic and aborting.
          case "$LATEST" in
            ''|*[!0-9]*) LATEST=0 ;;
          esac

          NEXT=$((LATEST + 1))
          if [ "$NEXT" -le 1 ] && [ -n "$BUILD_NUMBER" ]; then
            NEXT=$((BUILD_NUMBER + 1))
            echo "Could not read TestFlight — using CI counter, building $NEXT"
          else
            echo "TestFlight's highest is $LATEST — building $NEXT"
          fi
          echo "BUILD_NUMBER=$NEXT" >> "$CM_ENV"
      - name: Get Flutter packages
        script: flutter pub get
      # A release gate. This workflow is started by hand and can be pointed at
      # any commit, including one that never had a compile check. A failure
      # here stops the run before any ipa exists, so the log ends with "No
      # artifacts were found" — read the step list, not the last line.
      - name: Validate catalog, analyze and test before shipping
        script: |
          python3 tools/validate_catalog.py assets/data/catalog_v1.json
          flutter analyze
          flutter test
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
          # use-profiles writes this; without it the export below silently
          # falls back to Xcode's defaults and can produce a development
          # build, or nothing at all.
          if [ ! -f /Users/builder/export_options.plist ]; then
            echo "!! use-profiles did not write export_options.plist —"
            echo "   signing assets did not resolve. See the report above."
            exit 1
          fi
      - name: Build ipa for distribution
        script: |
          flutter build ipa --release \
            --build-name=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1) \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
      # `flutter build ipa` can finish having archived but not exported, and
      # the only symptom downstream is "No artifacts were found" at the very
      # end of the log — which names no step and no reason. Check here, where
      # there is still context to print.
      - name: Verify the ipa was produced
        script: |
          if ! ls build/ios/ipa/*.ipa >/dev/null 2>&1; then
            echo "!! no .ipa in build/ios/ipa — the export did not complete."
            echo "── build/ios ──"
            ls -lR build/ios 2>/dev/null | head -60 || echo "(no build/ios)"
            echo "── xcodebuild logs present ──"
            ls -l /tmp/xcodebuild_logs 2>/dev/null || echo "(none)"
            exit 1
          fi
          echo "Built: $(ls -lh build/ios/ipa/*.ipa)"
    artifacts:
      - build/ios/ipa/*.ipa
      # Collected whether or not the build succeeded: when the export fails
      # these logs carry the actual reason, and they are what is missing when
      # the run ends with "No artifacts were found".
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload to App Store Connect, and stop there. Internal TestFlight
        # testers (your own team, up to 100) get the build as soon as
        # processing finishes — no review, nothing to submit.
        #
        # submit_to_testflight: true would additionally submit for *external*
        # beta review, which Apple refuses until Beta App Information and Beta
        # App Review Information are filled in at
        # appstoreconnect.apple.com/apps/6807488973/testflight/test-info.
        # With it set and that form empty, the build succeeds and uploads but
        # post-processing still reports failure — which reads as a broken
        # build when nothing is broken. Turn it back on when external testing
        # is actually wanted, after filling in that form.
        submit_to_testflight: false
